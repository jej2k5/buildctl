[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buildctl"
dynamic = ["version"]
description = "Deterministic, restart-safe supervisor for agent-built software phases"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
buildctl = "buildctl.buildctl:main"

[tool.setuptools.packages.find]
include = ["buildctl*"]

[tool.setuptools.dynamic]
version = {attr = "buildctl.__version__"}

[tool.setuptools.package-data]
buildctl = ["protocol/prompts/*.md", "protocol/templates/*.json"]
