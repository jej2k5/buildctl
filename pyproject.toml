[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buildctl"
version = "0.1.0"
description = "Deterministic, restart-safe supervisor for agent-built software phases"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
buildctl = "buildctl.buildctl:main"

[tool.setuptools.packages.find]
include = ["buildctl*"]
