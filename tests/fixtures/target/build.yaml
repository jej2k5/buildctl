      "prompt": "prompts/phases/phase-21-billing-export.md"
    },
    {
      "number": 22,
      "name": "Self-serve onboarding",
      "prompt": "prompts/phases/phase-22-self-serve-onboarding.md"
    },
    {
      "number": 23,
      "name": "Operations runbook",
      "prompt": "prompts/phases/phase-23-operations-runbook.md"
    }
  ]
}
