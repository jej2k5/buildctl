      }
    },
    {
      "number": 15,
      "name": "Ordering guarantees",
      "prompt": "prompts/phases/phase-15-ordering-guarantees.md",
      "acceptance": {
        "merge_policy": "human"
      }
    },
    {
      "number": 16,
      "name": "Batch delivery",
      "prompt": "prompts/phases/phase-16-batch-delivery.md"
    },
    {
      "number": 17,
      "name": "Payload transformations",
      "prompt": "prompts/phases/phase-17-payload-transformations.md"
    },
    {
      "number": 18,
