name: Manual

on:
  push:
    branches: [main]
    paths: ["docs/**", "ui/buildctl_ui/web/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The committed page must match its Markdown; publish exactly what the console ships.
      - run: python3 docs/build.py --check
      # A committed page cannot name its own commit, so the published copy is stamped here.
      - run: sed -i "s|<span data-commit></span>|<span data-commit> at ${GITHUB_SHA::7}</span>|" ui/buildctl_ui/web/docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/buildctl_ui/web/docs
      - id: deploy
        uses: actions/deploy-pages@v4
